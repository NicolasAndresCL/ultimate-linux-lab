name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permisos mínimos por defecto; el job que publica los amplía.
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ultimate-linux-lab

jobs:
  # ---------------------------------------------------------------------------
  # Verificaciones rápidas (~1 min). Si algo falla aquí, no gastamos 15 minutos
  # construyendo una imagen que ya sabemos que está mal.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint y validación
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Buenas prácticas del Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          # Reglas ignoradas a propósito, no por comodidad:
          #   DL3008 — no se fijan versiones de apt: el lab debe traer los
          #            paquetes actuales de Ubuntu 24.04.
          #   DL3064 — la contraseña por defecto es de conocimiento público y así
          #            se documenta. Es un lab desechable cuyos puertos van solo a
          #            loopback, y `LAB_PASSWORD` permite cambiarla al construir.
          #            Revisar esta excepción si algún día el lab dejara de ser
          #            loopback-only: entonces dejaría de ser aceptable.
          #   DL3059 — los RUN van separados a propósito, para que Docker cachee
          #            por etapas y un cambio en GNOME no invalide el sistema base.
          ignore: DL3008,DL3064,DL3059

      - name: Scripts del escritorio
        run: shellcheck desktop/prepare-vnc-home desktop/xstartup

      - name: Sintaxis del compose
        run: docker compose config -q

      - name: Estructura de las units de systemd
        # No se usa `systemd-analyze verify`: fallaría porque los ExecStart
        # apuntan a binarios que solo existen dentro de la imagen. La comprobación
        # real la hace el smoke test con systemctl dentro del contenedor.
        run: |
          for unit in desktop/vncserver.service desktop/novnc.service; do
            for section in '\[Unit\]' '\[Service\]' '\[Install\]'; do
              grep -q "^$section" "$unit" \
                || { echo "::error file=$unit::falta la sección $section"; exit 1; }
            done
            echo "OK  $unit"
          done

      - name: Finales de línea LF
        # Protege .gitattributes: con CRLF el Dockerfile rompe el build en Linux.
        # Es la regresión más silenciosa de este proyecto.
        run: |
          if git ls-files --eol | grep -E 'w/crlf'; then
            echo "::error::hay archivos con CRLF en el índice; revisa .gitattributes"
            exit 1
          fi
          echo "OK  todos los archivos usan LF"

  # ---------------------------------------------------------------------------
  # Construye la imagen de verdad y levanta el lab. Durante el desarrollo el
  # build se rompió tres veces por causas que solo aparecen al construir
  # (paquetes sin candidato, binarios en otro paquete, /run/user/1000 ausente):
  # ninguna la detecta una revisión visual del Dockerfile.
  # ---------------------------------------------------------------------------
  build:
    name: Build y smoke test (${{ matrix.target }})
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # El lab de terminal construye en 2-3 min y cubre casi todo el temario.
          - target: base
            service: lab-cli
            contenedor: ubuntu-lab-cli
            tag: ultimate-linux-lab:24.04-cli
            profile: cli
            escritorio: false
          - target: desktop
            service: lab
            contenedor: ubuntu-lab
            tag: ultimate-linux-lab:24.04
            profile: ""
            escritorio: true
    steps:
      - uses: actions/checkout@v7

      - name: Liberar espacio en el runner
        # La imagen con escritorio pesa ~2,7 GB y el runner ronda los 14 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - uses: docker/setup-buildx-action@v4

      - name: Construir la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          # Se usa el mismo tag que espera el compose, para que `up` levante
          # exactamente la imagen que este job acaba de construir, sin rehacerla.
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Levantar el laboratorio
        run: |
          if [ -n "${{ matrix.profile }}" ]; then
            docker compose --profile "${{ matrix.profile }}" up -d "${{ matrix.service }}"
          else
            docker compose up -d "${{ matrix.service }}"
          fi

      - name: Esperar a que systemd termine de arrancar
        env:
          LAB: ${{ matrix.contenedor }}
        run: |
          for i in $(seq 1 30); do
            estado=$(docker exec "$LAB" systemctl is-system-running 2>/dev/null || true)
            echo "intento $i: $estado"
            case "$estado" in
              running|degraded) exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::systemd no llegó a estado running"
          exit 1

      - name: Verificar el sistema base
        env:
          LAB: ${{ matrix.contenedor }}
        run: |
          echo "--- usuario nico ---"
          docker exec "$LAB" id nico | tee /dev/stderr | grep -q 'uid=1000' \
            || { echo "::error::nico no tiene uid 1000"; exit 1; }
          docker exec "$LAB" id nico | grep -q 'sudo' \
            || { echo "::error::nico no está en el grupo sudo"; exit 1; }

          echo "--- man (protege el arreglo de man.REAL) ---"
          docker exec -u nico "$LAB" man ls | head -1 | grep -qi 'LS' \
            || { echo "::error::man no funciona"; exit 1; }

          echo "--- servicios del curso ---"
          for s in cron rsyslog; do
            estado=$(docker exec "$LAB" systemctl is-active "$s")
            echo "$s: $estado"
            [ "$estado" = active ] || { echo "::error::$s no está activo"; exit 1; }
          done

      - name: Verificar que el lab de terminal NO trae escritorio
        if: ${{ !matrix.escritorio }}
        env:
          LAB: ${{ matrix.contenedor }}
        run: |
          # Si GNOME se colara en la etapa `base`, el build volvería a durar 15
          # minutos sin que nadie se diera cuenta.
          if docker exec "$LAB" test -x /usr/bin/gnome-shell 2>/dev/null; then
            echo "::error::la etapa base incluye GNOME; debería ser solo terminal"
            exit 1
          fi
          echo "OK  sin escritorio, como se espera"

      - name: Verificar el escritorio
        if: ${{ matrix.escritorio }}
        env:
          LAB: ${{ matrix.contenedor }}
        run: |
          echo "--- GNOME tarda en arrancar; damos margen ---"
          for i in $(seq 1 24); do
            estado=$(docker exec "$LAB" systemctl is-active vncserver 2>/dev/null || true)
            echo "intento $i: vncserver=$estado"
            [ "$estado" = active ] && break
            sleep 5
          done
          [ "$(docker exec "$LAB" systemctl is-active vncserver)" = active ] \
            || { echo "::error::vncserver no arrancó"; exit 1; }
          [ "$(docker exec "$LAB" systemctl is-active novnc)" = active ] \
            || { echo "::error::novnc no arrancó"; exit 1; }

          echo "--- noVNC responde en el 6080 ---"
          curl -fsS -o /dev/null http://localhost:6080/vnc.html \
            || { echo "::error::noVNC no responde"; exit 1; }

          echo "--- gnome-shell corriendo ---"
          docker exec "$LAB" pgrep -c gnome-shell \
            || { echo "::error::gnome-shell no está corriendo"; exit 1; }

      - name: Diagnóstico (solo si algo falló)
        if: failure()
        env:
          LAB: ${{ matrix.contenedor }}
        run: |
          docker compose --profile cli ps || true
          docker compose --profile cli logs --tail 100 || true
          docker exec "$LAB" journalctl -u vncserver -n 60 --no-pager || true
          docker exec "$LAB" systemctl --failed || true

      - name: Apagar el laboratorio
        if: always()
        run: docker compose --profile cli down -v || true

  # ---------------------------------------------------------------------------
  # Escaneo de vulnerabilidades. La imagen se publica en un registro PÚBLICO, así
  # que hay que saber qué CVEs lleva. El informe completo va a la pestaña
  # Security del repositorio; el build solo se rompe si aparece un CRITICAL que
  # YA tiene parche disponible — fallar por CVEs sin arreglo convertiría el CI en
  # ruido que se acaba ignorando.
  # ---------------------------------------------------------------------------
  scan:
    name: Vulnerabilidades (${{ matrix.target }})
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        target: [base, desktop]
    steps:
      - uses: actions/checkout@v7

      - name: Liberar espacio en el runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen a escanear
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: lab-scan:${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}

      - name: Informe completo para la pestaña Security
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lab-scan:${{ matrix.target }}
          format: sarif
          output: trivy-${{ matrix.target }}.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Subir el informe
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.target }}.sarif
          category: trivy-${{ matrix.target }}

      - name: Romper el build si hay CRITICAL con parche disponible
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lab-scan:${{ matrix.target }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # Publica la imagen para que instalar el lab sea un `docker pull` de ~2 min
  # en vez de un build de 15. Solo en main: los PR no publican.
  # ---------------------------------------------------------------------------
  publish:
    name: Publicar en GHCR (${{ matrix.target }})
    needs: [build, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: desktop
            sufijo: ""          # `latest` y `24.04`
          - target: base
            sufijo: "-cli"      # `cli` y `24.04-cli`
    steps:
      - uses: actions/checkout@v7

      - name: Liberar espacio en el runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"

      - uses: docker/setup-buildx-action@v4

      - name: Autenticarse en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos y tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.target == 'desktop' && 'latest' || 'cli' }}
            type=raw,value=24.04${{ matrix.sufijo }}
            type=sha,prefix=sha-,suffix=${{ matrix.sufijo }},format=short

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reutiliza la caché que dejó el job `build`: no reconstruye desde cero.
          cache-from: type=gha,scope=${{ matrix.target }}
